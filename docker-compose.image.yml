services:
  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    command: mosquitto -c /mosquitto-no-auth.conf

  kerbl-to-mqtt:
    image: ${KERBL_TO_MQTT_IMAGE:-kerbl-to-mqtt:latest}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - mqtt

volumes:
  mosquitto-data:
  mosquitto-log: